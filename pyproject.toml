[project]
name = "llm-app"
version = "0.1.0"
description = "LLM SDK runner"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "llm_sdk",
    "mypy",
    "flake8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "llm_sdk.*"
warn_return_any = false

[tool.uv.sources]
llm_sdk = { path = "./llm_sdk", editable = true }
