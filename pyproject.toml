[project]
name = "llm-sdk"
version = "0.1.0"
description = "LLM SDK for local model inference"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.5",
    "llm_sdk",
    "mypy",
    "flake8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "llm_sdk.*"
warn_return_any = false
